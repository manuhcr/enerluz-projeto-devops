name: Pipeline EnerLuz - dev → Homologação | main → Produção

on:
  push:
    branches:
      - dev
      - main

jobs:

  deploy_homologacao:
    name: Deploy Homologação
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEVHOST }} >> ~/.ssh/known_hosts

      - name: Copiar arquivos para Homologação
        run: |
          scp -i ~/.ssh/deploy_key \
            index.html \
            ${{ secrets.EC2_USER }}@${{ secrets.DEVHOST }}:/home/ubuntu/enerluz/

      - name: Validar deploy
        run: |
          echo "Arquivos enviados para homologação com sucesso"

  deploy_producao:
    name: Deploy Produção
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    environment:
      name: producao

    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PRODHOST }} >> ~/.ssh/known_hosts

      - name: Copiar arquivos para Produção
        run: |
          scp -i ~/.ssh/deploy_key \
            index.html \
            ${{ secrets.EC2_USER }}@${{ secrets.PRODHOST }}:/home/ubuntu/enerluz/

      - name: Validar deploy
        run: |
          echo "Arquivos enviados para produção com sucesso"

name: Pipeline EnerLuz — CI/CD

on:
  push:
    branches:
      - dev
      - master

jobs:

  deploy_homologacao:
    name: Deploy Homologação (automático · porta 8080)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Copiar index.html para EC2
        run: |
          scp -i ~/.ssh/deploy_key \
            index.html \
            ${{ secrets.EC2_USER }}@${{ secrets.HOST }}:/tmp/index.html

      - name: Publicar em homologação (porta 8080)
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.HOST }} << 'EOF'
            sudo mkdir -p /var/www/homol
            sudo mv /tmp/index.html /var/www/homol/index.html

            sudo tee /etc/nginx/sites-available/homol > /dev/null << 'NGINX'
            server {
              listen 8080;
              root /var/www/homol;
              index index.html;
            }
            NGINX

            sudo ln -sf /etc/nginx/sites-available/homol \
              /etc/nginx/sites-enabled/homol
            sudo nginx -t && sudo systemctl reload nginx
            echo "Homologação publicada na porta 8080!"
          EOF

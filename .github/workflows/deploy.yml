name: Pipeline EnerLuz — CI/CD com Docker

on:
  push:
    branches:
      - dev
      - master

jobs:

  deploy_homologacao:
    name: Deploy Homologação (automático · porta 8080)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Copiar arquivos para EC2
        run: |
          scp -i ~/.ssh/deploy_key \
            index.html Dockerfile \
            ${{ secrets.EC2_USER }}@${{ secrets.HOST }}:/home/ubuntu/enerluz/

      - name: Build e deploy Docker — Homologação
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.HOST }} << 'EOF'
            cd /home/ubuntu/enerluz
            docker stop enerluz-homol 2>/dev/null || true
            docker rm enerluz-homol 2>/dev/null || true
            docker build -t enerluz-image:homol .
            docker run -d --name enerluz-homol \
              -p 8080:80 --restart unless-stopped \
              enerluz-image:homol
            echo "Homologação no ar na porta 8080!"
            docker ps
          EOF

  deploy_producao:
    name: Deploy Produção (aprovação manual · porta 80)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment: producao

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Copiar arquivos para EC2
        run: |
          scp -i ~/.ssh/deploy_key \
            index.html Dockerfile \
            ${{ secrets.EC2_USER }}@${{ secrets.HOST }}:/home/ubuntu/enerluz/

      - name: Build e deploy Docker — Produção
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.HOST }} << 'EOF'
            cd /home/ubuntu/enerluz
            docker stop enerluz-prd 2>/dev/null || true
            docker rm enerluz-prd 2>/dev/null || true
            docker build -t enerluz-image:prd .
            docker run -d --name enerluz-prd \
              -p 80:80 --restart unless-stopped \
              enerluz-image:prd
            echo "Produção no ar na porta 80!"
            docker ps
          EOF
